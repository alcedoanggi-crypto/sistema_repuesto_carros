<!doctype html>
<html lang="es-VE">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#EA580C" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700;800&family=Barlow:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <title>MACAI Autopartes — Repuestos para tu carro en Venezuela</title>
    <meta name="description" content="Repuestos y autopartes originales y genéricos para Toyota, Chevrolet, Ford, Hyundai, Mitsubishi y Kia. Busca por vehículo o número de parte. Envíos a toda Venezuela." />
    <script>
      // Aplica el tema antes de pintar para evitar parpadeo
      try {
        const t = localStorage.getItem('macai-theme');
        if (t === 'dark' || (!t && matchMedia('(prefers-color-scheme: dark)').matches)) document.documentElement.classList.add('dark');
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
